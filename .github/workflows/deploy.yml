name: Deploy AI Platform
 
on:
  push:
    branches:
      - main
 
jobs:
  deploy:
    runs-on: self-hosted
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Validate Docker Compose
        run: docker compose --env-file /etc/ai-platform/.env config
 
      - name: Pull container images
        run: docker compose --env-file /etc/ai-platform/.env pull
 
      - name: Deploy AI Platform
        run: docker compose --env-file /etc/ai-platform/.env up -d
 
      - name: Show container status
        run: docker compose ps