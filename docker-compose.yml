services:
 
  postgres:
    image: postgres:16
    container_name: ai-postgres
    restart: unless-stopped
 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
 
    volumes:
      - postgres-data:/var/lib/postgresql/data
 
    networks:
      - ai-network
 
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
 
 
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-qdrant
    restart: unless-stopped
 
    ports:
      - "6333:6333"
 
    volumes:
      - qdrant-data:/qdrant/storage
 
    networks:
      - ai-network
 
 
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: ai-litellm
    restart: unless-stopped
 
    ports:
      - "4000:4000"
 
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
 
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
 
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
 
    networks:
      - ai-network
 
 
  paloalto-mcp:
    build:
      context: ./mcp-servers/paloalto
 
    container_name: ai-paloalto-mcp
    restart: unless-stopped
 
    ports:
      - "8000:8000"
 
    environment:
      PANOS_HOST: ${PANOS_HOST}
      PANOS_API_KEY: ${PANOS_API_KEY}
      PANOS_VERIFY_SSL: ${PANOS_VERIFY_SSL:-false}
      PANOS_TIMEOUT: ${PANOS_TIMEOUT:-30}
      PANOS_VSYS: ${PANOS_VSYS:-vsys1}
 
    networks:
      ai-network:
        aliases:
          - paloalto-mcp
 
 
  rag-mcp:
    build:
      context: ./rag
 
    container_name: ai-rag-mcp
    restart: unless-stopped
 
    ports:
      - "8001:8000"
 
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: paloalto-docs
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      HF_HOME: /models/huggingface
 
    volumes:
      - rag-model-cache:/models/huggingface
 
    depends_on:
      - qdrant
 
    networks:
      ai-network:
        aliases:
          - rag-mcp
 
 
  rag-ingest:
    build:
      context: ./rag
 
    container_name: ai-rag-ingest
 
    command:
      - python
      - ingest.py
 
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: paloalto-docs
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      DOCUMENT_DIR: /documents
      RAG_CHUNK_SIZE: 1200
      RAG_CHUNK_OVERLAP: 200
      HF_HOME: /models/huggingface
 
    volumes:
      - /opt/ai-app/rag-documents:/documents:ro
      - rag-model-cache:/models/huggingface
 
    depends_on:
      - qdrant
 
    networks:
      - ai-network
 
    profiles:
      - ingest
 
 
  ai-agent:
    build:
      context: ./agent
 
    container_name: ai-agent
    restart: unless-stopped
 
    ports:
      - "8081:8080"
 
    environment:
      OLLAMA_BASE_URL: http://192.168.11.129:11434/v1
      OLLAMA_MODEL: qwen3:4b
      AGENT_MODEL_ID: paloalto-agent
      AGENT_API_KEY: ${AGENT_API_KEY}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-600}
 
      PALOALTO_MCP_URL: http://paloalto-mcp:8000/mcp
      RAG_MCP_URL: http://rag-mcp:8000/mcp
 
    depends_on:
      - paloalto-mcp
      - rag-mcp
 
    networks:
      - ai-network
 
 
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-open-webui
    restart: unless-stopped
 
    ports:
      - "3000:8080"
 
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "http://litellm:4000/v1;http://ai-agent:8080/v1"
      OPENAI_API_KEYS: "${LITELLM_MASTER_KEY};${AGENT_API_KEY}"
      ENABLE_PERSISTENT_CONFIG: "false"
      RESET_CONFIG_ON_START: "true"
 
    volumes:
      - open-webui-data:/app/backend/data
 
    depends_on:
      - litellm
      - ai-agent
 
    networks:
      - ai-network
 
 
  mcp-client:
    image: python:3.12-slim
    container_name: ai-mcp-client
 
    working_dir: /app
 
    volumes:
      - ./mcp-client:/app:ro
 
    command:
      - sh
      - -c
      - "pip install --no-cache-dir -r requirements.txt && python test_paloalto_mcp.py"
 
    depends_on:
      - paloalto-mcp
 
    networks:
      - ai-network
 
    profiles:
      - test
 
 
networks:
  ai-network:
    driver: bridge
 
 
volumes:
  postgres-data:
  qdrant-data:
  open-webui-data:
  rag-model-cache: