services:
 
  postgres:

    image: postgres:16

    container_name: ai-postgres

    restart: unless-stopped
 
    environment:

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}
 
    volumes:

      - postgres-data:/var/lib/postgresql/data
 
    networks:

      - ai-network
 
    healthcheck:

      test:

        - CMD-SHELL

        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}

      interval: 10s

      timeout: 5s

      retries: 5
 
 
  qdrant:

    image: qdrant/qdrant:latest

    container_name: ai-qdrant

    restart: unless-stopped
 
    ports:

      - "6333:6333"
 
    volumes:

      - qdrant-data:/qdrant/storage
 
    networks:

      - ai-network
 
 
  litellm:

    image: docker.litellm.ai/berriai/litellm:main-latest

    container_name: ai-litellm

    restart: unless-stopped
 
    ports:

      - "4000:4000"
 
    environment:

      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
 
    volumes:

      - ./litellm/config.yaml:/app/config.yaml:ro
 
    command:

      - "--config"

      - "/app/config.yaml"

      - "--port"

      - "4000"
 
    networks:

      - ai-network
 
 
  open-webui:

    image: ghcr.io/open-webui/open-webui:main

    container_name: ai-open-webui

    restart: unless-stopped
 
    ports:

      - "3000:8080"
 
    environment:

      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}

      ENABLE_OPENAI_API: "true"

      OPENAI_API_BASE_URL: http://litellm:4000/v1

      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
 
    volumes:

      - open-webui-data:/app/backend/data
 
    depends_on:

      - litellm
 
    networks:

      - ai-network
 
 
  paloalto-mcp:

    build:

      context: ./mcp-servers/paloalto
 
    container_name: ai-paloalto-mcp

    restart: unless-stopped
 
    ports:

      - "8000:8000"
 
    environment:

      PANOS_HOST: ${PANOS_HOST}

      PANOS_API_KEY: ${PANOS_API_KEY}

      PANOS_VERIFY_SSL: ${PANOS_VERIFY_SSL:-false}

      PANOS_TIMEOUT: ${PANOS_TIMEOUT:-30}
 
    networks:

      - ai-network
 
 
networks:

  ai-network:

    driver: bridge
 
 
volumes:

  postgres-data:

  qdrant-data:

  open-webui-data:
 